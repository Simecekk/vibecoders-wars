name: ci
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Trusted copy of main: the check scripts, conftest and game state come from here, not from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest-cov is listed explicitly so the coverage step also works on the PR that first adds it
      - run: pip install -r trusted/requirements.txt "pytest-cov>=5"
      - name: Check PR (title, paths, commits)
        id: pr
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.check_pr
      - name: Check imports between areas
        if: steps.pr.outputs.area != ''
        run: python trusted/scripts/check_imports.py "${{ steps.pr.outputs.area }}" --root pr
      - name: Formatting (ruff format)
        working-directory: pr
        run: ruff format --check --diff .
      - name: Lint (ruff check)
        working-directory: pr
        run: ruff check .
      - name: Tests + every endpoint has a test + coverage >= 80%
        working-directory: pr
        env:
          VV_AREA: ${{ steps.pr.outputs.area }}
        run: |
          # fixtures come only from trusted main: drop every conftest.py from the PR, use main's
          find . -name conftest.py -not -path "./.git/*" -delete
          cp ../trusted/tests/conftest.py tests/conftest.py
          cp ../trusted/scripts/tests/conftest.py scripts/tests/conftest.py
          # coverage settings (sources, fail_under = 80) live in pyproject.toml
          pytest tests scripts/tests --cov --cov-report=term-missing
