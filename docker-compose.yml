services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      # files the pages read at runtime; mounted so they stay current without a rebuild
      - ./RULES.md:/app/RULES.md:ro
      - ./data:/app/data:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
